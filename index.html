            bs[i].setAttribute(
              "aria-pressed",
              String(bs[i].dataset.bmode === bmode),
            );
          $("b-pending").hidden = !pendingImport;
          if (pendingImport) {
            $("b-summary").textContent =
              "Arquivo válido com " + importSummary(pendingImport) + ".";
            $("b-apply").textContent =
              bmode === "merge"
                ? "Mesclar"
                : armedReplace
                  ? "Confirmar: apagar dados atuais"
                  : "Substituir tudo";
          }
        }

        function exportBackup() {
          var obj = {
            app: "desgaste-kart",
            schema: 2,
            exportedAt: new Date().toISOString(),
            data: backupData(),
          };
          var name = "desgaste-kart-backup-" + todayIso() + ".json";
          saveFile(name, JSON.stringify(obj, null, 2), "application/json")
            .then(function () {
              state.lastBackup = todayIso();
              save();
              renderBackupInfo();
              toast("Backup " + name + " gerado. Veja a pasta Downloads.");
            })
            .catch(function (err) {
              if (err && err.code === "declined") return;
              toast("Não foi possível exportar o backup.");
            });
        }

        function readBackupFile(file) {
          var msg = $("b-msg");
          msg.textContent = "";
          pendingImport = null;
          armedReplace = false;
          if (!file) {
            renderBackupInfo();
            return;
          }
          if (file.size > 5 * 1024 * 1024) {
            msg.textContent =
              "Arquivo grande demais para ser um backup deste app.";
            renderBackupInfo();
            return;
          }
          var r = new FileReader();
          r.onload = function () {
            try {
              var obj = JSON.parse(String(r.result).replace(/^\ufeff/, ""));
              if (
                !obj ||
                obj.app !== "desgaste-kart" ||
                !obj.data ||
                typeof obj.data !== "object"
              )
                throw new Error("formato");
              var s = sanitize(obj.data);
              if (!s.tires && !s.cycles && !s.stock && !s.gear)
                throw new Error("vazio");
              pendingImport = s;
            } catch (e) {
              msg.textContent =
                "Este arquivo não parece ser um backup do Desgaste do kart.";
            }
            renderBackupInfo();
          };
          r.onerror = function () {
            msg.textContent = "Não foi possível ler o arquivo.";
            renderBackupInfo();
          };
          r.readAsText(file);
        }

        function mergeById(local, incoming) {
          var seen = {},
            added = 0;
          local.forEach(function (x) {
            seen[x.id] = 1;
          });
          incoming.forEach(function (x) {
            if (!seen[x.id]) {
              seen[x.id] = 1;
              local.push(x);
              added++;
            }
          });
          return added;
        }

        function applyImport() {
          if (!pendingImport) return;
          var s = pendingImport,
            report;
          if (bmode === "replace") {
            if (!armedReplace) {
              armedReplace = true;
              renderBackupInfo();
              setTimeout(function () {
                if (armedReplace) {
                  armedReplace = false;
                  renderBackupInfo();
                }
              }, 4000);
              return;
            }
            state.tires = s.tires || [];
            state.cycles = s.cycles || [];
            state.stock = s.stock || [];
            state.gear = s.gear || [];
            if (s.motors && s.motors.length) state.motors = s.motors;
            report = "Dados substituídos pelo conteúdo do backup.";
          } else {
            var n = {
              tires: mergeById(state.tires, s.tires || []),
              cycles: mergeById(state.cycles, s.cycles || []),
              stock: mergeById(state.stock, s.stock || []),
              gear: mergeById(state.gear, s.gear || []),
            };
            (s.motors || []).forEach(function (m) {
              if (state.motors.indexOf(m) === -1) state.motors.push(m);
            });
            report =
              "Mesclado: " +
              n.tires +
              " pneus, " +
              n.cycles +
              " ciclos, " +
              n.stock +
              " consumíveis e " +
              n.gear +
              " equipamentos novos.";
          }
          state.cycles.forEach(function (c) {
            if (state.motors.indexOf(c.motor) === -1)
              state.motors.push(c.motor);
          });
          state.cycles = state.cycles
            .map(function (c, i) {
              return [c, i];
            })
            .sort(function (a, b) {
              return (
                a[0].changeDate.localeCompare(b[0].changeDate) || a[1] - b[1]
              );
            })
            .map(function (x) {
              return x[0];
            });
          editItemId = null;
          editingId = null;
          manageStock = false;
          resetGearForm();
          pendingImport = null;
          armedReplace = false;
          selSet = lastSetOf(state.brand);
          save();
          renderTires();
          renderOil();
          renderStock();
          renderGear();
          renderBackupInfo();
          $("b-msg").textContent = "";
          toast(report);
        }

        /* ---------- abas e modo de horas ---------- */
        function setTab(tab) {
          state.tab = tab;
          ["pneus", "oleo", "estoque"].forEach(function (t) {
            $("tab-" + t).setAttribute("aria-selected", String(t === tab));
            $("panel-" + t).hidden = t !== tab;
          });
          save();
        }
        function setHmode(md) {
          state.hmode = md;
          var b = $("hmode-seg").querySelectorAll("button");
          for (var i = 0; i < b.length; i++)
            b[i].setAttribute("aria-pressed", String(b[i].dataset.mode === md));
          save();
        }

        /* ---------- início ---------- */
        load();
        selSet = lastSetOf(state.brand);
        $("t-date").value = todayIso();
        $("o-date").value = todayIso();
        setHmode(state.hmode);
        setTab(state.tab);
        renderTires();
        renderOil();
        setSview(state.sview);
        renderStock();
        renderGear();
        renderBackupInfo();

        $("tab-pneus").addEventListener("click", function () {
          setTab("pneus");
        });
        $("tab-oleo").addEventListener("click", function () {
          setTab("oleo");
        });
        $("tab-estoque").addEventListener("click", function () {
          setTab("estoque");
        });
        $("s-view").addEventListener("click", function (e) {
          var b = e.target.closest("button");
          if (b) setSview(b.dataset.view);
        });
        $("s-manage").addEventListener("click", function () {
          manageStock = !manageStock;
          editingId = null;
          editItemId = null;
          renderStock();
        });
        $("s-list").addEventListener("click", function (e) {
          var b = e.target.closest("[data-sact]");
          if (!b) return;
          var a = b.dataset.sact,
            id = b.dataset.id;
          if (a === "inc") bumpStock(id, 1);
          else if (a === "dec") bumpStock(id, -1);
          else if (a === "edit") {
            editingId = id;
            renderStock();
          } else if (a === "editrow") {
            editItemId = id;
            editingId = null;
            focusEdit = true;
            renderStock();
          } else if (a === "cancel") {
            editItemId = null;
            renderStock();
          } else if (a === "save") saveItem(id, b.closest("li"));
          else if (a === "uchip") {
            var ui = b.closest("li").querySelector(".se-unit");
            if (ui) ui.value = b.dataset.unit;
          }
        });
        $("s-list").addEventListener("keydown", function (e) {
          var t = e.target;
          if (!t.classList) return;
          if (t.classList.contains("sqty-in")) {
            if (e.key === "Enter") commitQty(t);
            else if (e.key === "Escape") {
              editingId = null;
              renderStock();
            }
          } else if (
            t.classList.contains("se-name") ||
            t.classList.contains("se-unit")
          ) {
            if (e.key === "Enter") saveItem(t.dataset.id, t.closest("li"));
            else if (e.key === "Escape") {
              editItemId = null;
              renderStock();
            }
          }
        });
        $("s-list").addEventListener("focusout", function (e) {
          if (e.target.classList && e.target.classList.contains("sqty-in"))
            commitQty(e.target);
        });
        $("s-units").addEventListener("click", function (e) {
          var b = e.target.closest("button");
          if (b) $("s-unit").value = b.dataset.unit;
        });
        $("s-add").addEventListener("click", addStock);
        ["s-name", "s-unit", "s-qty"].forEach(function (id) {
          $(id).addEventListener("keydown", function (e) {
            if (e.key === "Enter") addStock();
          });
        });
        $("g-add").addEventListener("click", addGear);
        $("g-cancel").addEventListener("click", function () {
          resetGearForm();
          renderGear();
        });
        $("g-list").addEventListener("click", function (e) {
          var b = e.target.closest("[data-gedit]");
          if (b) startGearEdit(b.dataset.gedit);
        });
        ["g-name", "g-ident", "g-obs"].forEach(function (id) {
          $(id).addEventListener("keydown", function (e) {
            if (e.key === "Enter") addGear();
          });
        });
        $("s-export").addEventListener("click", function () {
          exportCsv("stock");
        });
        $("g-export").addEventListener("click", function () {
          exportCsv("gear");
        });
        $("t-brands").addEventListener("click", function (e) {
          var b = e.target.closest("button");
          if (!b) return;
          state.brand = b.dataset.brand;
          selSet = lastSetOf(state.brand);
          $("t-setname").value = "";
          save();
          renderTireForm();
        });
        $("t-sets").addEventListener("click", function (e) {
          var b = e.target.closest("button");
          if (!b) return;
          selSet = Number(b.dataset.set);
          $("t-setname").value = "";
          renderTireForm();
        });
        $("t-track").addEventListener("click", function (e) {
          var b = e.target.closest("button");
          if (!b) return;
          state.track = b.dataset.track;
          save();
          renderTireForm();
        });
        $("hmode-seg").addEventListener("click", function (e) {
          var b = e.target.closest("button");
          if (!b) return;
          setHmode(b.dataset.mode);
          renderOil();
        });
        $("t-add").addEventListener("click", addTire);
        ["t-laps", "t-press", "t-obs", "t-setname"].forEach(function (id) {
          $(id).addEventListener("keydown", function (e) {
            if (e.key === "Enter") addTire();
          });
        });
        $("o-list").addEventListener("click", function (e) {
          var b = e.target.closest(".o-act");
          if (b) registerOil(b.dataset.motor, b.dataset.act);
        });
        $("o-list").addEventListener("change", function (e) {
          var t = e.target;
          if (t.classList && t.classList.contains("o-obs")) {
            var cs = motorCycles(t.dataset.motor);
            if (cs.length) {
              cs[cs.length - 1].obs = t.value.trim();
              save();
            }
          }
        });
        $("m-add").addEventListener("click", addMotor);
        $("m-new").addEventListener("keydown", function (e) {
          if (e.key === "Enter") addMotor();
        });
        $("b-export").addEventListener("click", exportBackup);
        $("b-pick").addEventListener("click", function () {
          $("b-file").value = "";
          $("b-file").click();
        });
        $("b-file").addEventListener("change", function () {
          readBackupFile(this.files && this.files[0]);
        });
        $("bmode-seg").addEventListener("click", function (e) {
          var b = e.target.closest("button");
          if (!b) return;
          bmode = b.dataset.bmode;
          armedReplace = false;
          renderBackupInfo();
        });
        $("b-apply").addEventListener("click", applyImport);
        $("b-cancel").addEventListener("click", function () {
          pendingImport = null;
          armedReplace = false;
          $("b-msg").textContent = "";
          renderBackupInfo();
        });
        $("t-export").addEventListener("click", function () {
          exportCsv("tires");
        });
        $("o-export").addEventListener("click", function () {
          exportCsv("oil");
        });

        // pede ao navegador para não descartar os dados salvos quando o espaço estiver baixo
        try {
          if (navigator.storage && navigator.storage.persist)
            Promise.resolve(navigator.storage.persist()).catch(function () {});
        } catch (e) {
          /* ignora */
        }
        // offline: registra o service worker (só no site publicado, nunca dentro do Claude)
        if (
          !window.claude &&
          "serviceWorker" in navigator &&
          location.protocol === "https:"
        ) {
          window.addEventListener("load", function () {
            navigator.serviceWorker.register("sw.js").catch(function () {
              /* ignora */
            });
          });
        }

        try {
          if (window.claude && typeof window.claude.use === "function") {
            window.claude
              .use("downloads")
              .then(function (ns) {
                dl = ns || null;
              })
              .catch(function () {
                dl = null;
              });
          }
        } catch (e) {
          dl = null;
        }
      })();
    </script>
  </body>
</html>
